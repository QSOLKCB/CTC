[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctc-reference"
version = "0.3.0"
description = "Deterministic numerical reference implementation for Coupled Telescopic Coevolution"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QSOL-IMC" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

schema_version: "1.0"
contract: "CTC-MATHEMATICAL-CORE-v0.1"
status: "draft-pre-formalisation"

purpose:
  statement: >-
    Model coupled human-AI capability development, explicit transition-time
    compression, and verification load without assuming AGI, ASI, or a
    technological singularity.

state:
  continuous:
    A:
      domain: "R>0"
      meaning: "dimensionless AI capability index"
    H:
      domain: "R>0"
      meaning: "dimensionless human epistemic-capability index"
  discrete:
    T_A:
      domain: "R>=T_A_min"
      meaning: "effective AI capability-transition interval"
    T_H:
      domain: "R>=T_H_min"
      meaning: "effective human epistemic-transition interval"
    B:
      domain: "R>=0"
      meaning: "unresolved verification backlog"

sampling_alignment:
  model_epochs: >-
    Use a declared equally spaced common calendar-time sequence
    t_n = t_0 + n*Delta_t with Delta_t>0. Sample continuous capability as
    A[n]=A(t_n) and H[n]=H(t_n); T_A[n], T_H[n], and B[n] evolve on that
    common model index.
  coefficient_units: >-
    eta_A, eta_H, xi_HA, xi_AH, lambda_A, and mu_H are effective coefficients
    per declared epoch width Delta_t. Changing Delta_t requires re-parameterising
    those coefficients; the same numerical values must not be reused on a refined
    or coarsened grid.
  empirical_events: >-
    AI and human capability-threshold crossings may use separate event indices.
    A fit to the common model index must declare the interpolation/alignment rule
    and uncertainty; the nth AI event must not be silently identified with the
    nth human event.

parameters:
  positive:
    - A_0
    - H_0
    - K_A
    - K_H
    - alpha_A
    - alpha_H
    - T_A_min
    - T_H_min
    - eta_A
    - eta_H
    - lambda_A
    - mu_H
  nonnegative_mutual_regime:
    - gamma_HA
    - gamma_AH
    - xi_HA
    - xi_AH

coupling_functions:
  S_A:
    expression: "A / (A_0 + A)"
    invariants:
      - "0 < S_A(A) < 1 for A>0,A_0>0"
      - "strictly increasing in A"
      - "limit at +infinity is 1"
  S_H:
    expression: "H / (H_0 + H)"
    invariants:
      - "0 < S_H(H) < 1 for H>0,H_0>0"
      - "strictly increasing in H"
      - "limit at +infinity is 1"

capability_dynamics:
  type: "continuous-autonomous-ode"
  equations:
    A_dot: "A * (alpha_A * (1 - A/K_A) + gamma_HA * S_H(H))"
    H_dot: "H * (alpha_H * (1 - H/K_H) + gamma_AH * S_A(A))"
  invariants:
    - "positive initial states remain positive on the solution interval"
    - "bounded cross-coupling cannot by itself force unbounded growth"
  upper_barriers:
    A: "K_A * (1 + gamma_HA/alpha_A)"
    H: "K_H * (1 + gamma_AH/alpha_H)"
  interior_equilibrium:
    existence: >-
      For positive A_0,H_0,K_A,K_H,alpha_A,alpha_H and nonnegative
      gamma_HA,gamma_AH, at least one equilibrium exists in the positive quadrant.
    bounds:
      A: "K_A <= A_star <= K_A*(1 + gamma_HA/alpha_A)"
      H: "K_H <= H_star <= K_H*(1 + gamma_AH/alpha_H)"

interior_jacobian:
  definitions:
    p: "alpha_A * A_star / K_A"
    q: "alpha_H * H_star / K_H"
    b: "gamma_HA * A_star * H_0 / (H_0 + H_star)^2"
    c: "gamma_AH * H_star * A_0 / (A_0 + A_star)^2"
  assumptions:
    - "p>0"
    - "q>0"
    - "b>=0"
    - "c>=0"
  matrix:
    - ["-p", "b"]
    - ["c", "-q"]
  trace: "-(p+q)"
  determinant: "p*q - b*c"
  discriminant: "(p-q)^2 + 4*b*c"
  local_stability_condition: "b*c < p*q"
  minimal_model_spectral_invariant: >-
    For b>=0 and c>=0 the discriminant is nonnegative, so the local
    eigenvalues are real and the minimal two-state positive-coupling model
    lacks the complex-eigenpair prerequisite for Hopf bifurcation.

telescopic_time:
  A_next: >-
    T_A_min + (T_A - T_A_min) *
    exp(-(eta_A + xi_HA * S_H(H)))
  H_next: >-
    T_H_min + (T_H - T_H_min) *
    exp(-(eta_H + xi_AH * S_A(A)))
  invariants:
    - "T_A >= T_A_min is preserved for admissible initial state T_A[0]>=T_A_min"
    - "T_H >= T_H_min is preserved for admissible initial state T_H[0]>=T_H_min"
    - "strict compression occurs above the floor"
    - "T_A converges to T_A_min when eta_A>0"
    - "T_H converges to T_H_min when eta_H>0"
    - "for T_A>T_A_min and xi_HA>0, increasing H strictly strengthens AI-timescale compression"
    - "for T_H>T_H_min and xi_AH>0, increasing A strictly strengthens human-timescale compression"
    - "at T_A=T_A_min or T_H=T_H_min, the corresponding next interval is pinned at the floor and no strict cross-capability effect is asserted"
    - "baseline eta compression alone does not establish coupled telescopic coevolution"
  transformed_outcomes:
    Y_A: "-log((T_A_next-T_A_min)/(T_A-T_A_min)) for T_A>T_A_min"
    Y_H: "-log((T_H_next-T_H_min)/(T_H-T_H_min)) for T_H>T_H_min"
  transformed_equations:
    Y_A: "eta_A + xi_HA*S_H(H)"
    Y_H: "eta_H + xi_AH*S_A(A)"
  observed_ratios:
    kappa_A: "T_A_next / T_A"
    kappa_H: "T_H_next / T_H"
    tau: "T_H / T_A"
  strong_coupled_attribution:
    - "xi_AH > 0 or an identified equivalent AI-caused human-timescale effect"
    - "xi_HA > 0 or an identified equivalent human-caused AI-timescale effect"

verification:
  backlog_next: "max(0, B + lambda_A*A - mu_H*H)"
  load_ratio: "Xi = lambda_A*A / (mu_H*H)"
  coefficient_units: >-
    lambda_A*A and mu_H*H are demand and service quantities per declared
    fixed-width model epoch Delta_t.
  interpretation:
    "Xi<1": "verification demand below service capacity for the step"
    "Xi=1": "critical load for the step"
    "Xi>1": "verification backlog increases for the step"

empirical_claims:
  A:
    statement: "AI capability is increasing on fixed measurements"
    evidence_label: "OBSERVED"
  B:
    statement: "meaningful AI development intervals are compressing"
    evidence_label: "HYPOTHESIS"
  C:
    statement: "AI materially contributes to later AI development"
    evidence_label: "HYPOTHESIS"
  D:
    statement: "AI increases human productivity on bounded tasks"
    evidence_label: "CAUSAL"
  E:
    statement: "AI increases durable human learning or reasoning capacity"
    evidence_label: "HYPOTHESIS"
  F:
    statement: "AI increases scientific or technological discovery rate"
    evidence_label: "ESTIMATED"
  G:
    statement: "AI-enhanced humans subsequently produce measurably better AI"
    evidence_label: "HYPOTHESIS"
  H:
    statement: "the complete human-AI feedback loop is self-accelerating"
    evidence_label: "SPECULATIVE"

empirical_estimands:
  naming:
    statement: >-
      A_0 and H_0 are reserved for saturation reference scales. Experimental
      capability states use distinct names such as A_low/A_high and H_low/H_high.
  gamma_AH: >-
    Causal coefficient on S_A(A) in the per-capita H growth equation after
    accounting for alpha_H*(1-H/K_H); a finite contrast identifies
    gamma_AH*[S_A(A_high)-S_A(A_low)], not gamma_AH by itself.
  gamma_HA: >-
    Causal coefficient on S_H(H) in the per-capita A growth equation after
    accounting for alpha_A*(1-A/K_A); a finite contrast identifies
    gamma_HA*[S_H(H_high)-S_H(H_low)]. Successor-AI designs must isolate the
    retained human-mediated effect from direct assistant exposure.
  xi_AH: >-
    For T_H>T_H_min, define Y_H=-log((T_H_next-T_H_min)/(T_H-T_H_min)).
    xi_AH is the causal coefficient on S_A(A) in Y_H after accounting for eta_H;
    a finite contrast identifies xi_AH*[S_A(A_high)-S_A(A_low)]. Exact-floor
    epochs contain no strict local information about xi_AH in the v0.1 recurrence.
  xi_HA: >-
    For T_A>T_A_min, define Y_A=-log((T_A_next-T_A_min)/(T_A-T_A_min)).
    xi_HA is the causal coefficient on S_H(H) in Y_A after accounting for eta_A;
    a finite contrast identifies xi_HA*[S_H(H_high)-S_H(H_low)]. Exact-floor
    epochs contain no strict local information about xi_HA in the v0.1 recurrence.
  threshold_spacing: >-
    Telescoping tests require equal capability-threshold increments on the
    declared scale or interval normalization by the threshold increment.
  falsification_equivalence: >-
    A failure to reject a coupling coefficient equal to zero is not evidence of
    negligible coupling. Strong rejection requires pre-specified smallest
    scientifically meaningful positive magnitudes for gamma_AH, gamma_HA,
    xi_AH, and xi_HA, together with equivalence or upper-bound analyses whose
    upper confidence/credible bounds fall below the corresponding thresholds.

strong_ctc_requires:
  - "gamma_AH > 0 under an identified empirical design"
  - "gamma_HA > 0 under an identified mediated empirical design"
  - "xi_AH > 0 or equivalent identified AI-caused human-timescale compression beyond eta_H"
  - "xi_HA > 0 or equivalent identified human-caused AI-timescale compression beyond eta_A"
  - "effects persist beyond a one-time level shift"
  - "T_A and T_H use fixed reproducible equal-increment capability thresholds or normalized interval estimates"
  - "at least one human epistemic transition timescale compresses partly because of AI"
  - "at least one later AI capability measure improves partly because of AI-enhanced retained human capability"

falsification_thresholds:
  required_pre_registration:
    - "delta_gamma_AH > 0"
    - "delta_gamma_HA > 0"
    - "delta_xi_AH > 0"
    - "delta_xi_HA > 0"
  rule: >-
    Strong rejection of a coupling direction requires an equivalence or upper-bound
    analysis at the pre-specified uncertainty level placing the coefficient's upper
    confidence/credible bound below its corresponding delta threshold. Failure to
    reject a point null of zero is insufficient.

forbidden_inferences:
  - "formal theorem => empirical truth"
  - "task productivity gain => durable learning gain"
  - "AI capability growth => self-accelerating coupled coevolution"
  - "finite geometric time sum => physical technological singularity"
  - "model release interval => capability generation interval without a fixed threshold"
  - "nonzero AI-to-human coupling => nonzero human-to-AI coupling"
  - "baseline eta compression => cross-timescale coupling"
  - "raw capability contrast => gamma coupling coefficient without saturation transformation"
  - "raw interval change or kappa<1 => xi coupling coefficient without floor-distance log transformation"
  - "exact-floor epoch => strict local information about xi"
  - "unequal threshold spacing => telescoping without normalization"
  - "direct AI assistance during successor development => human-mediated gamma_HA"
  - "failed significance test for gamma=0 or xi=0 => coupling is absent"
  - "reuse fixed-step coefficients after changing Delta_t => same discrete model"

formal_targets:
  - CTC-MATH-001
  - CTC-MATH-002
  - CTC-MATH-003
  - CTC-MATH-004
  - CTC-MATH-005
  - CTC-MATH-006
  - CTC-MATH-007
  - CTC-MATH-008
  - CTC-MATH-009
  - CTC-MATH-010
  - CTC-MATH-011
  - CTC-MATH-012
  - CTC-MATH-013
  - CTC-MATH-014
